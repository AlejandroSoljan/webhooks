name: Mecan TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['mecan-testflight-*']

permissions:
  contents: read

concurrency: mecan-testflight

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ios-mecan
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
      - name: Sign, archive and upload
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MECAN_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MECAN_IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.MECAN_IOS_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.MECAN_ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.MECAN_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.MECAN_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${CERTIFICATE:?Missing distribution certificate}" "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${PROFILE:?Missing provisioning profile}" "${ASC_KEY:?Missing App Store Connect key}"
          : "${ASC_KEY_ID:?Missing key ID}" "${ASC_ISSUER_ID:?Missing issuer ID}"
          signing="$RUNNER_TEMP/mecan-signing"
          mkdir -p "$signing"
          printf '%s' "$CERTIFICATE" | base64 -D > "$signing/distribution.p12"
          printf '%s' "$PROFILE" | base64 -D > "$signing/mecan.mobileprovision"
          printf '%s' "$ASC_KEY" | base64 -D > "$signing/key.p8"
          security cms -D -i "$signing/mecan.mobileprovision" > "$signing/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$signing/profile.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$signing/profile.plist")" = '6TJ9WJ9766.ar.com.asisto.mecan'
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$signing/profile.plist")" = production
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$signing/mecan.mobileprovision" "$profiles/$profile_uuid.mobileprovision"
          keychain="$signing/signing.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$profiles/$profile_uuid.mobileprovision"; rm -rf "$signing"' EXIT
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          # Security.framework needs a PKCS#12 container using legacy-compatible algorithms.
          openssl pkcs12 -in "$signing/distribution.p12" -passin env:CERTIFICATE_PASSWORD -nocerts -nodes -out "$signing/private.pem"
          openssl pkcs12 -in "$signing/distribution.p12" -passin env:CERTIFICATE_PASSWORD -clcerts -nokeys -out "$signing/cert.pem"
          openssl pkcs12 -export -in "$signing/cert.pem" -inkey "$signing/private.pem" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -passout env:CERTIFICATE_PASSWORD -out "$signing/apple-distribution.p12"
          security import "$signing/apple-distribution.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          sed -i '' "/        DEVELOPMENT_TEAM:/a\
                  CODE_SIGN_STYLE: Manual\
                  CODE_SIGN_IDENTITY: Apple Distribution\
                  PROVISIONING_PROFILE_SPECIFIER: $profile_uuid
          " project.yml
          xcodegen generate
          xcodebuild -project Mecan.xcodeproj -scheme Mecan -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$signing/Mecan.xcarchive" \
            MECAN_APS_ENVIRONMENT=production \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          codesign -d --entitlements :- "$signing/Mecan.xcarchive/Products/Applications/Mecan.app" > "$signing/entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$signing/entitlements.plist")" = production
          options="$signing/export.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' \
            -c 'Add :destination string upload' -c 'Add :teamID string 6TJ9WJ9766' \
            -c 'Add :signingStyle string manual' -c 'Add :signingCertificate string Apple Distribution' \
            -c 'Add :manageAppVersionAndBuildNumber bool false' -c 'Add :provisioningProfiles dict' \
            -c "Add :provisioningProfiles:ar.com.asisto.mecan string $profile_uuid" "$options"
          xcodebuild -exportArchive -archivePath "$signing/Mecan.xcarchive" \
            -exportPath "$signing/export" -exportOptionsPlist "$options" \
            -allowProvisioningUpdates -authenticationKeyPath "$signing/key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
