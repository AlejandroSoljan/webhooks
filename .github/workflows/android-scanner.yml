name: Android Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [codex/android-scanner]
    paths: ['android-scanner/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: asisto-scanner-debug
          path: android-scanner/app/build/outputs/apk/debug/app-debug.apk
