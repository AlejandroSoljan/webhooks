# Asisto | Dominio adicional, validación ACME | 2026-10-27
server {
    listen 80;
    listen [::]:80;
    server_name asisto.com.ar www.asisto.com.ar;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/asisto-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}
