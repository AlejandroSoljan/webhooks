# Asisto | Dominio adicional; conserva asistobot.com.ar | 2026-10-27
server {
    listen 80;
    listen [::]:80;
    server_name asisto.com.ar www.asisto.com.ar;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/asisto-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name asisto.com.ar www.asisto.com.ar;
    ssl_certificate /etc/letsencrypt/live/asisto.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asisto.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    include /etc/nginx/snippets/asisto-turnero.conf;
    include /etc/nginx/snippets/mecan-privacy.conf;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
