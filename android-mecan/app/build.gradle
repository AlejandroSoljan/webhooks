plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'ar.com.asisto.mecan'
    compileSdk 36

    defaultConfig {
        applicationId 'ar.com.asisto.mecan'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            if (System.getenv('MECAN_UPLOAD_STORE')) {
                storeFile file(System.getenv('MECAN_UPLOAD_STORE'))
                storePassword System.getenv('MECAN_UPLOAD_PASSWORD')
                keyAlias 'mecan-upload'
                keyPassword System.getenv('MECAN_UPLOAD_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name in ['bundleRelease', 'assembleRelease'] } && !System.getenv('MECAN_UPLOAD_STORE')) {
        throw new GradleException('Use build-release.ps1 para cargar la firma de Mecan.')
    }
}

def alternateBuildDir = System.getenv('ASISTO_ANDROID_BUILD_DIR')
if (alternateBuildDir) {
    layout.buildDirectory.set(file(alternateBuildDir))
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-messaging'
}
