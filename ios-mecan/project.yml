name: Mecan
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Mecan:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [GoogleService-Info.plist]
      - path: Sources/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.asisto.mecan
        DEVELOPMENT_TEAM: 6TJ9WJ9766
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Escaneá códigos de productos y turnos de Mecan.
        CODE_SIGN_ENTITLEMENTS: Mecan.entitlements
        MECAN_APS_ENVIRONMENT: development
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0


