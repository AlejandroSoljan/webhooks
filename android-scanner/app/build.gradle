plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'ar.com.asistobot.scanner'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.com.asistobot.scanner'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def alternateBuildDir = System.getenv('ASISTO_ANDROID_BUILD_DIR')
if (alternateBuildDir) {
    layout.buildDirectory.set(file(alternateBuildDir))
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-messaging'
}
